<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS Speaking 교사용</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#667085; --line:#e4e7ec;
          --ok:#12805c; --warn:#b54708; --bad:#c0362c; --accent:#2f5bd3; --rec:#d92d20; --soft:#eef2fb; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 17px; margin: 0; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .card { background: var(--card); border:1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  input[type=text], input[type=password], input[type=number], select, textarea {
    padding: 9px 11px; font-size: 15px; border:1px solid var(--line); border-radius: 8px; font-family: inherit; width: 100%; background:#fff; }
  textarea { resize: vertical; }
  label.f { display:block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  button, .btn { appearance:none; border:0; border-radius: 8px; padding: 8px 13px; font-size: 14px; font-weight: 600;
    background: var(--accent); color:#fff; cursor:pointer; display:inline-flex; align-items:center; gap:4px; font-family: inherit; }
  .ghost { background: var(--soft); color: var(--accent); }
  .plain { background: #fff; color: var(--ink); border:1px solid var(--line); }
  .rec { background: var(--rec); color:#fff; }
  .danger { background:#fff; color: var(--bad); border:1px solid #f3c4bf; }
  button:disabled { opacity:.45; cursor: default; }
  .row { display:flex; gap:8px; flex-wrap: wrap; align-items:center; }
  .between { justify-content: space-between; }
  .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .part { margin: 22px 0 8px; display:flex; justify-content:space-between; align-items:center; }
  .part h2 small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
  .tag { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--soft); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
  .qtext { font-size: 16px; margin: 6px 0 2px; }
  .cue { font-size: 13px; color: var(--muted); white-space: pre-line; background:#fffbea; border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
  .meta { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .badges { display:flex; gap:6px; flex-wrap: wrap; margin: 8px 0; }
  .badge { font-size: 12px; border-radius: 999px; padding: 2px 10px; background:#e8f6ef; color: var(--ok); }
  .badge.none { background:#fff4e5; color: var(--warn); }
  .media { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 10px; }
  .meter { height: 8px; background:#eef0f4; border-radius: 4px; overflow:hidden; width: 120px; }
  .meter > div { height:100%; width:0; background: var(--rec); }
  audio, video { width: 100%; margin-top: 8px; border-radius: 8px; }
  video { max-height: 280px; background:#000; }
  .hidden { display:none !important; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color:#fff;
           padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 9; max-width: 90vw; }
  .toast.bad { background: var(--bad); }
  .switch { display:inline-flex; align-items:center; gap:6px; font-size: 14px; cursor:pointer; }
  .switch input { width: 18px; height: 18px; }
  .hint { font-size: 12px; color: var(--muted); }
  .tabs { display:flex; gap:6px; margin-bottom: 12px; }
  .tab { background:#fff; color: var(--muted); border:1px solid var(--line); }
  .tab.on { background: var(--ink); color:#fff; border-color: var(--ink); }
  .arow { display:grid; grid-template-columns: 1fr auto; gap: 4px 12px; cursor:pointer; }
  .arow:hover { border-color: var(--accent); }
  .st-미채점 { background:#f2f4f7; color: var(--muted); } .st-AI.초안, .st-ai { background:#eef2fb; color: var(--accent); }
  .st-검토 { background:#fff4e5; color: var(--warn); } .st-공개 { background:#e8f6ef; color: var(--ok); }
  .pill { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
  .bands { display:grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .bands label { font-size: 12px; color: var(--muted); display:block; margin-bottom: 2px; }
  .bands input { text-align:center; font-weight: 700; }
  .teacher-only { border: 1px dashed #c7d2fe; background: #f8f9ff; }
  .tbox { background:#f9fafb; border:1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; white-space: pre-wrap; }
  details summary { cursor:pointer; font-size: 13px; color: var(--accent); margin-top: 8px; }
  .sticky { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0; display:flex; gap: 8px; flex-wrap: wrap; }
  @media (max-width: 560px) { .bands { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>IELTS Speaking 교사용</h1>
  <p class="sub">출제: 차수와 질문, 질문 음성·영상 관리 · 채점: 학생 답변 듣기, AI 초안 검토, 피드백 공개</p>

  <section id="vLogin" class="card">
    <div class="row">
      <input type="password" id="key" placeholder="교사 키" autocomplete="off" style="flex:1; min-width:160px">
      <button id="btnLogin">들어가기</button>
    </div>
  </section>

  <section id="vMain" class="hidden">
    <div class="tabs"><button class="tab on" data-tab="author">출제</button><button class="tab" data-tab="grade">채점</button></div>
   <div id="tabAuthor">
    <div class="card row between">
      <div class="row" style="flex:1; min-width: 240px"><select id="setSel" style="flex:1"></select></div>
      <div class="row"><button class="ghost" id="btnNewSet">+ 새 차수</button><button class="plain" id="btnReload">새로고침</button></div>
    </div>
    <div id="setBox"></div>
    <div id="partsBox"></div>
   </div>
   <div id="tabGrade" class="hidden">
    <div id="gList">
      <div class="card row between">
        <div class="row" style="flex:1; min-width:240px"><select id="gSet" style="flex:1"></select><select id="gStatus" style="width:auto">
          <option value="">전체 상태</option><option>미채점</option><option>AI 초안</option><option>검토 중</option><option>공개</option></select></div>
        <button class="plain" id="gReload">새로고침</button>
      </div>
      <div id="gRows"></div>
    </div>
    <div id="gDetail" class="hidden"></div>
   </div>
  </section>
</main>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwX9kHZlbXfXKmWgrXJfnwFZH9uWew0T4xXwbsq2OQmP5aos8lgDDIthdLEAw_BJDJFNA/exec';
const RATE = 24000;
const VIDEO_MAX_MB = 25, AUDIO_MAX_MB = 15;
const DEF = { p1: 30, p2prep: 60, p2long: 120, p2follow: 30, p3: 120 };
const PART_DESC = { 1: '일상 질문', 2: '큐카드(메인) + 후속 질문', 3: '심화 토론' };

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let KEY = '', SETS = [], CUR = '';

/* ---------------- API ---------------- */
async function apiGet(params) {
  const r = await fetch(`${API_URL}?${new URLSearchParams(params)}`, { cache: 'no-store' });
  const d = await r.json(); if (!d.ok) throw Object.assign(new Error(d.error), { server: true }); return d;
}
async function apiPost(payload) {
  payload.key = KEY; payload.reqId = rid(); const body = JSON.stringify(payload);
  try { const d = await fetch(API_URL, { method: 'POST', body }).then(r => r.json());
        if (!d.ok) throw Object.assign(new Error(d.error), { server: true }); return d; }
  catch (e) { if (e.server) throw e; }
  await fetch(API_URL, { method: 'POST', mode: 'no-cors', body });
  for (let i = 0; i < 60; i++) {
    await sleep(1500);
    try { const d = await fetch(`${API_URL}?action=status&id=${payload.reqId}`, { cache: 'no-store' }).then(r => r.json());
          if (d.ok) return d; if (d.error) throw Object.assign(new Error(d.error), { server: true }); }
    catch (e) { if (e.server) throw e; }
  }
  throw new Error('서버 응답을 확인하지 못했습니다.');
}
function toast(text, bad) {
  const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = text;
  document.body.appendChild(t); setTimeout(() => t.remove(), bad ? 5000 : 2200);
}
async function busy(btn, label, fn) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = label;
  try { return await fn(); } catch (e) { toast(e.message || String(e), true); }
  finally { btn.disabled = false; btn.textContent = old; }
}

/* ---------------- 로그인/불러오기 ---------------- */
$('btnLogin').onclick = () => busy($('btnLogin'), '확인 중…', async () => {
  KEY = $('key').value.trim();
  await reload();
  try { sessionStorage.setItem('tkey', KEY); } catch (_) {}
  $('vLogin').classList.add('hidden'); $('vMain').classList.remove('hidden');
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
});
$('key').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnLogin').click(); });
try { const k = sessionStorage.getItem('tkey'); if (k) { $('key').value = k; $('btnLogin').click(); } } catch (_) {}
$('btnReload').onclick = () => busy($('btnReload'), '불러오는 중…', reload);

async function reload(selectId) {
  SETS = (await apiGet({ action: 'tsets', key: KEY })).sets;
  if (selectId) CUR = selectId;
  if (!SETS.find(s => s.id === CUR)) CUR = SETS.length ? SETS[SETS.length - 1].id : '';
  render();
}

/* ---------------- 차수 ---------------- */
$('setSel').onchange = e => { CUR = e.target.value; render(); };
$('btnNewSet').onclick = () => { CUR = '__new'; render(); };

function render() {
  const sel = $('setSel'); sel.innerHTML = '';
  SETS.forEach(s => sel.add(new Option(`${s.id} · ${s.title}  ${s.open ? '🟢 공개' : '⚪ 비공개'}  (${s.questions.length}문항)`, s.id)));
  if (CUR === '__new') sel.add(new Option('(새 차수 만드는 중)', '__new'));
  sel.value = CUR;
  renderSet(); renderParts();
}

function renderSet() {
  const box = $('setBox');
  const isNew = CUR === '__new';
  const s = isNew ? { id: '', title: '', guide: '조용한 곳에서 응시하세요. 질문을 들은 뒤 “삐” 소리가 나면 답변을 시작합니다.', open: false, showText: false, questions: [] }
                  : SETS.find(x => x.id === CUR);
  if (!s) { box.innerHTML = '<div class="card sub">차수가 없습니다. “+ 새 차수”를 눌러 만드세요.</div>'; return; }
  box.innerHTML = `
    <div class="card">
      <div class="row between"><h2>${isNew ? '새 차수' : esc(s.id) + ' 설정'}</h2>
        <div class="row">
          <label class="switch"><input type="checkbox" data-open ${s.open ? 'checked' : ''}> 학생에게 공개</label>
          <label class="switch"><input type="checkbox" data-show ${s.showText ? 'checked' : ''}> 질문 글자 표시</label>
        </div></div>
      <label class="f">제목</label><input type="text" data-title value="${esc(s.title)}" placeholder="예: 모의고사 2회 (Travel)">
      <label class="f">시작 전 안내문</label><textarea data-guide rows="2">${esc(s.guide)}</textarea>
      <p class="hint">‘질문 글자 표시’를 끄면 실제 시험처럼 듣기만 합니다 (Part 2 큐카드는 항상 표시). 준비가 끝나면 ‘학생에게 공개’를 켜고 저장하세요.</p>
      <div class="row"><button data-save>${isNew ? '차수 만들기' : '설정 저장'}</button>
        ${isNew ? '<button class="plain" data-cancel>취소</button>' : '<button class="danger" data-del>차수 삭제</button>'}</div>
    </div>`;
  const f = n => box.querySelector(`[data-${n}]`);
  f('save').onclick = () => busy(f('save'), '저장 중…', async () => {
    const d = await apiPost({ action: 'setSave', set: { id: s.id, title: f('title').value, guide: f('guide').value,
      open: f('open').checked, showText: f('show').checked } });
    toast(isNew ? `${d.id} 차수를 만들었어요. 이제 문항을 추가하세요.` : '저장했어요.');
    await reload(d.id);
  });
  if (isNew) f('cancel').onclick = () => { CUR = SETS.length ? SETS[SETS.length - 1].id : ''; render(); };
  else f('del').onclick = confirmTwice(f('del'), '정말 삭제? (문항·미디어 포함)', () => busy(f('del'), '삭제 중…', async () => {
    await apiPost({ action: 'setDelete', setId: s.id }); toast('차수를 삭제했어요.'); CUR = ''; await reload();
  }));
}

function confirmTwice(btn, label, fn) {
  return () => {
    if (btn.dataset.armed === '1') { btn.dataset.armed = ''; return fn(); }
    const old = btn.textContent; btn.dataset.armed = '1'; btn.textContent = label;
    setTimeout(() => { if (btn.dataset.armed === '1') { btn.dataset.armed = ''; btn.textContent = old; } }, 3500);
  };
}

/* ---------------- Part별 문항 ---------------- */
function renderParts() {
  const box = $('partsBox'); box.innerHTML = '';
  const s = SETS.find(x => x.id === CUR); if (!s) return;
  [1, 2, 3].forEach(p => {
    const qs = s.questions.filter(q => q.part === p);
    const head = document.createElement('div'); head.className = 'part';
    head.innerHTML = `<h2>Part ${p}<small>${PART_DESC[p]} · ${qs.length}문항</small></h2>`;
    const add = document.createElement('button'); add.className = 'ghost'; add.textContent = `+ Part ${p} 문항 추가`;
    head.appendChild(add); box.appendChild(head);
    const list = document.createElement('div'); box.appendChild(list);
    qs.forEach((q, i) => list.appendChild(questionCard(s, q, i, qs.length)));
    add.onclick = () => { const f = editForm(s, { part: p, cue: '' }, null); list.appendChild(f); f.querySelector('[data-text]').focus(); add.disabled = true; f._onClose = () => add.disabled = false; };
  });
}

function timesText(q) {
  const ans = q.answerRaw ? `${q.answer}초` : `${q.answer}초(기본)`;
  if (q.longTurn) return `준비 ${q.prepRaw ? q.prep + '초' : q.prep + '초(기본)'} · 답변 ${ans}`;
  return `답변 ${ans}`;
}

function questionCard(s, q, idx, n) {
  const el = document.createElement('div'); el.className = 'card';
  const media = [];
  if (q.video) media.push('<span class="badge">▶ YouTube</span>');
  if (q.videoFileId) media.push('<span class="badge">🎞 영상 파일</span>');
  if (q.audioId) media.push('<span class="badge">🎙 음성</span>');
  if (!media.length) media.push('<span class="badge none">미디어 없음 — 학생 화면에 글자만 표시</span>');
  el.innerHTML = `
    <div class="row between"><span class="tag">P${q.part}-${idx + 1}${q.part === 2 ? (q.longTurn ? ' · 큐카드' : ' · 후속') : ''}</span>
      <div class="row"><button class="plain" data-up ${idx === 0 ? 'disabled' : ''}>↑</button><button class="plain" data-down ${idx === n - 1 ? 'disabled' : ''}>↓</button>
        <button class="ghost" data-edit>수정</button><button class="danger" data-del>삭제</button></div></div>
    <div class="qtext">${esc(q.text)}</div>
    ${q.cue ? `<div class="cue">${esc(q.cue)}</div>` : ''}
    <div class="meta">${timesText(q)}</div>
    <div class="badges">${media.join('')}</div>
    <div class="media">
      <div class="row">
        <button class="rec" data-rec>● 음성 녹음</button>
        <div class="meter hidden" data-meter><div></div></div><span class="hint hidden" data-time></span>
        <label class="btn ghost">음성 파일<input type="file" accept="audio/*,.m4a,.mp3,.wav" data-afile class="hidden"></label>
        <label class="btn ghost">영상 파일<input type="file" accept="video/mp4,video/*" data-vfile class="hidden"></label>
        ${q.audioId ? '<button class="plain" data-play-a>음성 듣기</button>' : ''}
        ${q.videoFileId ? '<button class="plain" data-play-v>영상 보기</button>' : ''}
        ${q.audioId ? '<button class="danger" data-del-a>음성 삭제</button>' : ''}
        ${q.videoFileId ? '<button class="danger" data-del-v>영상 삭제</button>' : ''}
      </div>
      <div data-preview></div>
      <div class="row hidden" data-pending style="margin-top:8px"><button data-msave>올리기</button><button class="plain" data-mcancel>취소</button><span class="hint" data-pinfo></span></div>
    </div>`;
  const f = n => el.querySelector(`[data-${n}]`);

  f('up').onclick = () => busy(f('up'), '…', async () => { await apiPost({ action: 'qMove', qid: q.qid, dir: 'up' }); await reload(); });
  f('down').onclick = () => busy(f('down'), '…', async () => { await apiPost({ action: 'qMove', qid: q.qid, dir: 'down' }); await reload(); });
  f('del').onclick = confirmTwice(f('del'), '정말 삭제?', () => busy(f('del'), '삭제 중…', async () => {
    await apiPost({ action: 'qDelete', qid: q.qid }); toast('문항을 삭제했어요.'); await reload();
  }));
  f('edit').onclick = () => { const form = editForm(s, q, el); el.replaceWith(form); form._onClose = () => {}; };

  /* 미디어: 미리보기 후 올리기 */
  let pending = null;
  const showPending = (blob, kind, mime, ext, info) => {
    pending = { blob, kind, mime, ext };
    const url = URL.createObjectURL(blob);
    f('preview').innerHTML = kind === 'video' ? `<video controls playsinline src="${url}"></video>` : `<audio controls src="${url}"></audio>`;
    f('pending').classList.remove('hidden'); f('pinfo').textContent = info;
  };
  const clearPending = () => { pending = null; f('preview').innerHTML = ''; f('pending').classList.add('hidden'); };
  f('mcancel').onclick = clearPending;
  f('msave').onclick = () => busy(f('msave'), '올리는 중…', async () => {
    const d = await apiPost({ action: 'qmediaSave', qid: q.qid, kind: pending.kind, mime: pending.mime, ext: pending.ext, data: await toBase64(pending.blob) });
    toast(`${pending.kind === 'video' ? '영상' : '음성'}을 올렸어요 (${d.sizeKB}KB)`); await reload();
  });

  f('rec').onclick = async () => {
    if (REC.active && REC.owner === el) {
      const blob = stopRecording();
      f('rec').textContent = '● 다시 녹음'; f('meter').classList.add('hidden'); f('time').classList.add('hidden');
      showPending(blob, 'audio', 'audio/wav', 'wav', '들어보고 괜찮으면 ‘올리기’를 누르세요.'); return;
    }
    if (REC.active) return toast('다른 문항을 녹음 중입니다. 먼저 정지하세요.', true);
    try { await startRecording(el, f('meter').firstElementChild, f('time')); }
    catch (e) { return toast('마이크를 켤 수 없습니다: ' + (e.name === 'NotAllowedError' ? '권한을 허용해 주세요.' : e.message), true); }
    clearPending(); f('rec').textContent = '■ 정지'; f('meter').classList.remove('hidden'); f('time').classList.remove('hidden');
  };
  f('afile').onchange = e => {
    const file = e.target.files[0]; e.target.value = ''; if (!file) return;
    if (file.size > AUDIO_MAX_MB * 1048576) return toast(`음성 파일은 ${AUDIO_MAX_MB}MB 이하만 올릴 수 있어요.`, true);
    showPending(file, 'audio', file.type || 'audio/mpeg', ext(file.name, 'mp3'), `${file.name} · ${Math.round(file.size / 1024)}KB`);
  };
  f('vfile').onchange = e => {
    const file = e.target.files[0]; e.target.value = ''; if (!file) return;
    if (file.size > VIDEO_MAX_MB * 1048576) return toast(`영상은 ${VIDEO_MAX_MB}MB 이하만 올릴 수 있어요. 길이를 줄이거나 해상도를 낮춰 주세요 (긴 영상은 YouTube 링크 권장).`, true);
    const e2 = ext(file.name, 'mp4');
    const warn = (e2 === 'mov' || /quicktime/.test(file.type)) ? ' ⚠ .mov는 Windows·갤럭시탭에서 재생이 안 될 수 있어요. mp4를 권장합니다.' : '';
    showPending(file, 'video', file.type || 'video/mp4', e2, `${file.name} · ${(file.size / 1048576).toFixed(1)}MB${warn}`);
  };

  const fetchMedia = async (id, kind, btn) => busy(btn, '불러오는 중…', async () => {
    const d = await apiGet({ action: 'qaudio', key: KEY, id });
    const url = URL.createObjectURL(b64ToBlob(d.data, d.mime));
    f('preview').innerHTML = kind === 'video' ? `<video controls playsinline autoplay src="${url}"></video>` : `<audio controls autoplay src="${url}"></audio>`;
  });
  if (f('play-a')) f('play-a').onclick = () => fetchMedia(q.audioId, 'audio', f('play-a'));
  if (f('play-v')) f('play-v').onclick = () => fetchMedia(q.videoFileId, 'video', f('play-v'));
  if (f('del-a')) f('del-a').onclick = confirmTwice(f('del-a'), '정말 삭제?', () => busy(f('del-a'), '삭제 중…', async () => { await apiPost({ action: 'qmediaDelete', qid: q.qid, kind: 'audio' }); await reload(); }));
  if (f('del-v')) f('del-v').onclick = confirmTwice(f('del-v'), '정말 삭제?', () => busy(f('del-v'), '삭제 중…', async () => { await apiPost({ action: 'qmediaDelete', qid: q.qid, kind: 'video' }); await reload(); }));
  return el;
}

/* 문항 입력/수정 폼 */
function editForm(s, q, cardEl) {
  const el = document.createElement('div'); el.className = 'card'; el.style.borderColor = 'var(--accent)';
  const isNew = !q.qid;
  el.innerHTML = `
    <div class="row between"><h2>${isNew ? `새 문항 (Part ${q.part})` : '문항 수정'}</h2>
      <select data-part style="width:auto">${[1, 2, 3].map(p => `<option value="${p}" ${p === q.part ? 'selected' : ''}>Part ${p}</option>`).join('')}</select></div>
    <label class="f">질문 (학생 화면에 표시되거나, 음성이 없을 때 읽게 되는 문장)</label>
    <textarea data-text rows="2" placeholder="예: Do you enjoy cooking? Why or why not?">${esc(q.text || '')}</textarea>
    <div data-cuewrap>
      <label class="f">큐카드 (Part 2 메인 질문만 입력 · 비워 두면 후속 질문으로 처리)</label>
      <textarea data-cue rows="5" placeholder="You should say:&#10;- …&#10;- …&#10;and explain …">${esc(q.cue || '')}</textarea>
    </div>
    <div class="grid2">
      <div data-prepwrap><label class="f">준비 시간(초)</label><input type="number" min="0" data-prep value="${esc(q.prepRaw || '')}"></div>
      <div><label class="f">답변 시간(초)</label><input type="number" min="5" data-answer value="${esc(q.answerRaw || '')}"></div>
    </div>
    <label class="f">YouTube 링크 (선택 · 미등록 영상 권장)</label>
    <input type="text" data-video value="${esc(q.video || '')}" placeholder="https://youtu.be/…">
    <p class="hint">음성·영상 파일은 저장한 뒤 문항 카드에서 녹음하거나 올릴 수 있어요. 시간 칸을 비우면 기본값이 적용됩니다.</p>
    <div class="row"><button data-save>${isNew ? '문항 추가' : '저장'}</button><button class="plain" data-cancel>취소</button></div>`;
  const f = n => el.querySelector(`[data-${n}]`);
  const sync = () => {
    const p = +f('part').value, long = p === 2 && f('cue').value.trim();
    f('cuewrap').classList.toggle('hidden', p !== 2);
    f('prepwrap').classList.toggle('hidden', !long);
    f('answer').placeholder = `기본 ${p === 1 ? DEF.p1 : p === 3 ? DEF.p3 : long ? DEF.p2long : DEF.p2follow}`;
    f('prep').placeholder = `기본 ${DEF.p2prep}`;
  };
  f('part').onchange = sync; f('cue').oninput = sync; sync();
  f('cancel').onclick = () => { if (cardEl) el.replaceWith(cardEl); else el.remove(); el._onClose && el._onClose(); };
  f('save').onclick = () => busy(f('save'), '저장 중…', async () => {
    const p = +f('part').value;
    await apiPost({ action: 'qSave', setId: s.id, q: { qid: q.qid || '', part: p, text: f('text').value,
      cue: p === 2 ? f('cue').value : '', video: f('video').value,
      prep: (p === 2 && f('cue').value.trim()) ? f('prep').value : '', answer: f('answer').value } });
    toast(isNew ? '문항을 추가했어요. 이제 음성이나 영상을 올리세요.' : '저장했어요.');
    await reload();
  });
  return el;
}

/* ---------------- 녹음 엔진 ---------------- */
const REC = { ctx: null, stream: null, proc: null, active: false, chunks: [], owner: null, t0: 0, timer: null };
async function startRecording(owner, bar, timeEl) {
  const AC = window.AudioContext || window.webkitAudioContext;
  REC.ctx = new AC(); if (REC.ctx.state === 'suspended') await REC.ctx.resume();
  REC.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } });
  const src = REC.ctx.createMediaStreamSource(REC.stream);
  REC.proc = REC.ctx.createScriptProcessor(4096, 1, 1); REC.chunks = [];
  REC.proc.onaudioprocess = ev => {
    const d = ev.inputBuffer.getChannelData(0); REC.chunks.push(new Float32Array(d));
    let m = 0; for (let i = 0; i < d.length; i++) { const v = Math.abs(d[i]); if (v > m) m = v; }
    bar.style.width = Math.min(100, m * 160) + '%';
  };
  const mute = REC.ctx.createGain(); mute.gain.value = 0;
  src.connect(REC.proc); REC.proc.connect(mute); mute.connect(REC.ctx.destination);
  REC.active = true; REC.owner = owner; REC.t0 = Date.now();
  REC.timer = setInterval(() => timeEl.textContent = Math.round((Date.now() - REC.t0) / 1000) + '초', 250);
}
function stopRecording() {
  const rate = REC.ctx.sampleRate; clearInterval(REC.timer);
  try { REC.proc.disconnect(); } catch (_) {}
  REC.stream.getTracks().forEach(t => t.stop()); REC.ctx.close(); REC.active = false; REC.owner = null;
  let len = 0; REC.chunks.forEach(c => len += c.length);
  const all = new Float32Array(len); let o = 0; REC.chunks.forEach(c => { all.set(c, o); o += c.length; });
  return encodeWav(trimSilence(downsample(all, rate, RATE)), RATE);
}
function trimSilence(s) {
  const th = 0.02, pad = Math.floor(RATE * 0.15); let a = 0, b = s.length - 1;
  while (a < s.length && Math.abs(s[a]) < th) a++;
  while (b > a && Math.abs(s[b]) < th) b--;
  return b <= a ? s : s.slice(Math.max(0, a - pad), Math.min(s.length, b + pad));
}
function downsample(buf, from, to) {
  if (to >= from) return buf;
  const r = from / to, n = Math.floor(buf.length / r), out = new Float32Array(n); let pos = 0;
  for (let i = 0; i < n; i++) { const end = Math.floor((i + 1) * r); let s = 0, c = 0; for (; pos < end && pos < buf.length; pos++) { s += buf[pos]; c++; } out[i] = c ? s / c : 0; }
  return out;
}
function encodeWav(samples, rate) {
  const buf = new ArrayBuffer(44 + samples.length * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
  v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, samples.length * 2, true);
  for (let i = 0, o = 44; i < samples.length; i++, o += 2) { const s = Math.max(-1, Math.min(1, samples[i])); v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
  return new Blob([buf], { type: 'audio/wav' });
}
function ext(name, d) { const m = String(name).match(/\.([a-z0-9]+)$/i); return m ? m[1].toLowerCase() : d; }
async function toBase64(blob) {
  const bytes = new Uint8Array(await blob.arrayBuffer()); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64ToBlob(b64, mime) {
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], { type: mime });
}

/* ======================= 채점 ======================= */
let GA = [], GCUR = null;
function switchTab(t) {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $('tabAuthor').classList.toggle('hidden', t !== 'author'); $('tabGrade').classList.toggle('hidden', t !== 'grade');
  if (t === 'grade') { fillSetFilter(); showList(); loadAttempts(); }
}
function fillSetFilter() {
  const sel = $('gSet'), cur = sel.value; sel.innerHTML = '<option value="">전체 차수</option>';
  SETS.forEach(s => sel.add(new Option(`${s.id} · ${s.title}`, s.id))); sel.value = cur;
}
$('gSet').onchange = renderAttempts; $('gStatus').onchange = renderAttempts;
$('gReload').onclick = () => busy($('gReload'), '불러오는 중…', loadAttempts);
async function loadAttempts() { GA = (await apiGet({ action: 'tattempts', key: KEY })).attempts; renderAttempts(); }
const pillCls = g => 'pill ' + (g === '미채점' ? 'st-미채점' : g === 'AI 초안' ? 'st-ai' : g === '검토 중' ? 'st-검토' : 'st-공개');
function renderAttempts() {
  const set = $('gSet').value, st = $('gStatus').value;
  const list = GA.filter(a => (!set || a.setId === set) && (!st || a.grade === st));
  $('gRows').innerHTML = list.length ? '' : '<div class="card sub">응시 기록이 없습니다.</div>';
  list.forEach(a => {
    const el = document.createElement('div'); el.className = 'card arow';
    el.innerHTML = `<div><b>${esc(a.name)}</b> <span class="hint">${esc(a.sid)}</span><div class="hint">${esc(a.setTitle)} · ${esc(a.start)} · 답변 ${a.answers}개${a.status && a.status !== '완료' ? ' · ' + esc(a.status) : ''}</div></div>
      <div style="text-align:right"><span class="${pillCls(a.grade)}">${esc(a.grade)}</span>${a.band ? `<div class="hint" style="margin-top:4px">Band ${esc(a.band)}</div>` : ''}</div>`;
    el.onclick = () => openAttempt(a.attemptId);
    $('gRows').appendChild(el);
  });
}
function showList() { $('gList').classList.remove('hidden'); $('gDetail').classList.add('hidden'); }
async function openAttempt(id) {
  try { const d = await apiGet({ action: 'tattempt', key: KEY, id }); renderDetail(d); }
  catch (e) { toast(e.message, true); }
}

function overallBand(arr) {
  const v = arr.map(Number).filter(n => !isNaN(n) && n > 0); if (v.length < 4) return '';
  return String(Math.floor(v.reduce((s, n) => s + n, 0) / 4 * 2 + 0.5) / 2);
}

function renderDetail(d) {
  GCUR = d; const a = d.attempt;
  $('gList').classList.add('hidden'); const box = $('gDetail'); box.classList.remove('hidden'); window.scrollTo(0, 0);
  const hasDraft = d.answers.some(x => x.aiTranscript || x.aiNotes);
  box.innerHTML = `
    <div class="row between" style="margin-bottom:10px"><button class="plain" data-back>← 목록</button><span class="${pillCls(a.grade)}">${esc(a.grade)}</span></div>
    <div class="card"><h2>${esc(a.name)} <span class="hint">${esc(a.sid)}</span></h2>
      <div class="hint">${esc(a.setTitle)} · ${esc(a.start)}${a.end ? ' ~ ' + esc(a.end.slice(11)) : ''} · ${esc(a.status || '')}</div>
      <div class="row" style="margin-top:12px"><button data-ai>🤖 AI 초안 ${hasDraft ? '다시 ' : ''}만들기</button>
        ${hasDraft ? '<label class="switch"><input type="checkbox" data-ow> 학생 피드백도 새 초안으로 덮어쓰기</label>' : ''}
        <span class="hint" data-prog></span></div>
      <p class="hint" style="margin:8px 0 0">AI는 녹음과 질문만 받고, 이름·학번은 보내지 않습니다. 초안은 학생에게 바로 보이지 않아요. 검토 후 ‘학생에게 공개’를 눌러야 공개됩니다.</p>
    </div>
    <div class="card teacher-only"><div class="row between"><h2>Band (교사 전용 · 학생에게 보이지 않음)</h2></div>
      <div class="bands" style="margin-top:10px">
        ${[['fc', 'FC'], ['lr', 'LR'], ['gra', 'GRA'], ['p', 'P']].map(([k, l]) => `<div><label>${l}</label><input type="number" step="0.5" min="0" max="9" data-band="${k}" value="${esc(a.bands[k])}"></div>`).join('')}
        <div><label>전체</label><input type="number" step="0.5" min="0" max="9" data-band="overall" value="${esc(a.bands.overall)}"></div>
      </div>
      <p class="hint">FC 유창성·일관성 · LR 어휘 · GRA 문법 · P 발음. 4개 기준을 바꾸면 전체가 IELTS 방식(0.5 단위 반올림)으로 다시 계산됩니다.</p>
      ${a.rationale ? `<details open><summary>AI 판단 근거</summary><div class="tbox" style="margin-top:6px">${esc(a.rationale)}</div></details>` : ''}
    </div>
    <div data-answers></div>
    <div class="card"><h2>종합 피드백 (학생용)</h2>
      <textarea data-summary rows="8" style="margin-top:8px" placeholder="AI 초안을 만들면 여기에 채워집니다. 자유롭게 고치세요.">${esc(a.teacherSummary)}</textarea></div>
    <div class="sticky"><button class="plain" data-save>임시 저장</button>
      ${a.published ? '<button class="danger" data-unpub>공개 취소</button><button data-pub>수정 내용 공개</button>' : '<button data-pub>학생에게 공개</button>'}</div>`;
  const f = n => box.querySelector(`[data-${n}]`);
  f('back').onclick = () => { showList(); loadAttempts().catch(() => {}); };
  box.querySelectorAll('[data-band]').forEach(inp => inp.oninput = () => {
    if (inp.dataset.band !== 'overall') f('band="overall"').value = overallBand(['fc', 'lr', 'gra', 'p'].map(k => f(`band="${k}"`).value));
  });
  const ansBox = f('answers');
  d.answers.forEach(x => ansBox.appendChild(answerCard(x)));
  f('save').onclick = () => busy(f('save'), '저장 중…', async () => { renderDetail(await saveGrade(a.published)); toast('저장했어요.'); });
  f('pub').onclick = () => busy(f('pub'), '공개 중…', async () => { renderDetail(await saveGrade(true)); toast('학생에게 공개했어요.'); });
  if (f('unpub')) f('unpub').onclick = () => busy(f('unpub'), '처리 중…', async () => { renderDetail(await saveGrade(false)); toast('공개를 취소했어요.'); });
  f('ai').onclick = () => busy(f('ai'), 'AI 분석 중…', () => runAi(f('ow') ? f('ow').checked : false, f('prog')));
}

function answerCard(x) {
  const el = document.createElement('div'); el.className = 'card'; el.dataset.part = x.part; el.dataset.order = x.order;
  el.innerHTML = `
    <div class="row between"><span class="tag">P${x.part}-${x.order}</span><span class="hint">${esc(x.duration)}초${Number(x.peak) < 0.02 ? ' · ⚠ 소리 거의 없음' : ''}</span></div>
    <div class="qtext">${esc(x.question)}</div>
    <div class="row" style="margin-top:6px"><button class="plain" data-listen>▶ 학생 녹음 듣기</button></div><div data-player></div>
    <label class="f">AI 전사</label><div class="tbox" data-tr>${x.aiTranscript ? esc(x.aiTranscript) : '<span class="hint">아직 없음</span>'}</div>
    <details data-notesw ${x.aiNotes ? '' : 'class="hidden"'}><summary>AI 메모 (교사용)</summary><div class="tbox" style="margin-top:6px" data-notes>${esc(x.aiNotes)}</div></details>
    <label class="f">학생에게 줄 피드백</label><textarea rows="7" data-fb placeholder="AI 초안을 만들면 채워집니다.">${esc(x.teacherFeedback)}</textarea>`;
  const f = n => el.querySelector(`[data-${n}]`);
  f('listen').onclick = () => busy(f('listen'), '불러오는 중…', async () => {
    const d = await apiGet({ action: 'tanswerAudio', key: KEY, fileId: x.fileId });
    f('player').innerHTML = `<audio controls autoplay src="${URL.createObjectURL(b64ToBlob(d.data, d.mime))}"></audio>`;
  });
  el._update = r => {
    f('tr').textContent = r.aiTranscript || '(인식된 발화 없음)';
    f('notes').textContent = r.aiNotes || ''; f('notesw').classList.toggle('hidden', !r.aiNotes);
    if (r.teacherFeedback != null) f('fb').value = r.teacherFeedback;
  };
  return el;
}

function collect() {
  const box = $('gDetail'); const v = k => box.querySelector(`[data-band="${k}"]`).value;
  return {
    answers: [...box.querySelectorAll('[data-answers] > .card')].map(c => ({ part: +c.dataset.part, order: +c.dataset.order, teacherFeedback: c.querySelector('[data-fb]').value })),
    overall: { fc: v('fc'), lr: v('lr'), gra: v('gra'), p: v('p'), overall: v('overall'), teacherSummary: box.querySelector('[data-summary]').value }
  };
}
async function saveGrade(publish) {
  return apiPost({ action: 'gradeSave', attemptId: GCUR.attempt.attemptId, publish, ...collect() });
}
async function runAi(overwrite, prog) {
  const a = GCUR.attempt;
  await saveGrade(a.published);                         // 지금까지 고친 내용 먼저 저장
  const cards = [...$('gDetail').querySelectorAll('[data-answers] > .card')];
  for (let i = 0; i < cards.length; i++) {
    const c = cards[i]; prog.textContent = `문항 ${i + 1}/${cards.length} 분석 중… (문항당 10~30초)`;
    c.style.borderColor = 'var(--accent)';
    const r = await apiPost({ action: 'aiAnswer', attemptId: a.attemptId, part: +c.dataset.part, order: +c.dataset.order, overwrite });
    c._update(r); c.style.borderColor = '';
  }
  prog.textContent = '종합 평가 작성 중…';
  const d = await apiPost({ action: 'aiOverall', attemptId: a.attemptId, overwrite });
  renderDetail(d); toast('AI 초안을 만들었어요. 검토 후 공개하세요.');
}
