<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CNSA IELTS · 교사용</title>
<link rel="icon" href="cnsa-logo.png">
<style>
  :root { --navy:#161470; --navy-2:#2b28a0; --navy-soft:#ecebfa; --gold:#fabe0d; --gold-2:#ffd34d; --gold-soft:#fff6d9; --gold-ink:#7a5700;
          --bg:#f4f5fa; --card:#fff; --ink:#1b1d33; --muted:#6b6f86; --line:#e3e5ef;
          --ok:#12805c; --warn:#b54708; --bad:#c0362c; --accent:#161470; --rec:#d92d20; --soft:#ecebfa;
          --shadow: 0 1px 2px rgba(22,20,112,.06), 0 4px 16px rgba(22,20,112,.06); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font: 15px/1.55 "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  .topnav { background: var(--navy); color:#fff; display:flex; align-items:center; gap:14px; padding: 10px clamp(16px, 2.5vw, 40px);
            border-bottom: 4px solid var(--gold); position: sticky; top: 0; z-index: 6; }
  .topnav img { height: 44px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.25)); }
  .brand { display:flex; flex-direction:column; line-height:1.2; } .brand b { font-size: 18px; } .brand span { font-size: 12px; color: var(--gold-2); letter-spacing: 1.5px; }
  .topnav .tabs { margin: 0; }
  main { padding: 22px clamp(16px, 2.5vw, 40px) 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; color: var(--navy); }
  h2 { font-size: 17px; margin: 0; color: var(--navy); display:flex; align-items:center; gap: 8px; flex-wrap: wrap; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .card { background: var(--card); border:1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
  input[type=text], input[type=password], input[type=number], select, textarea {
    padding: 10px 12px; font-size: 15px; border:1.5px solid var(--line); border-radius: 10px; font-family: inherit; width: 100%; background:#fff; color: var(--ink); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--navy-2); box-shadow: 0 0 0 3px var(--navy-soft); }
  textarea { resize: vertical; line-height: 1.6; }
  label.f { display:block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; font-weight: 600; }
  button, .btn { appearance:none; border:0; border-radius: 9px; padding: 9px 14px; font-size: 14px; font-weight: 700;
    background: var(--navy); color:#fff; cursor:pointer; display:inline-flex; align-items:center; gap:4px; font-family: inherit; transition: background .15s; }
  button:hover, .btn:hover { background: var(--navy-2); }
  .ghost { background: var(--navy-soft); color: var(--navy); } .ghost:hover { background:#dddcf6; }
  .gold { background: var(--gold); color: var(--navy); } .gold:hover { background: var(--gold-2); }
  .plain { background: #fff; color: var(--ink); border:1px solid var(--line); } .plain:hover { background:#f7f7fb; }
  .rec { background: var(--rec); color:#fff; } .rec:hover { background:#b42318; }
  .danger { background:#fff; color: var(--bad); border:1px solid #f3c4bf; } .danger:hover { background:#fff5f4; }
  button:disabled { opacity:.45; cursor: default; }
  .row { display:flex; gap:8px; flex-wrap: wrap; align-items:center; }
  .between { justify-content: space-between; }
  .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .hidden { display:none !important; }
  .hint { font-size: 12.5px; color: var(--muted); }
  .switch { display:inline-flex; align-items:center; gap:6px; font-size: 14px; cursor:pointer; font-weight: 600; color: var(--ink); }
  .switch input { width: 18px; height: 18px; accent-color: var(--navy); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--navy); color:#fff; border-left: 5px solid var(--gold);
           padding: 12px 18px; border-radius: 10px; font-size: 14px; z-index: 9; max-width: 90vw; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  .toast.bad { background: var(--bad); border-left-color: #fff; }

  /* 로그인 */
  .login { max-width: 520px; margin: 8vh auto; text-align:center; }
  .login img { width: 140px; margin-bottom: 8px; }

  /* 탭 */
  .tabs { display:flex; gap:4px; background: rgba(255,255,255,.08); padding: 4px; border-radius: 10px; }
  .tab { background: transparent; color:#d9d8f5; padding: 8px 18px; }
  .tab:hover { background: rgba(255,255,255,.12); }
  .tab.on { background: var(--gold); color: var(--navy); }

  /* 출제: Part 3열 */
  .parts { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .pcol { background: #eceef7; border-radius: 16px; padding: 12px; min-height: 120px; }
  .part { margin: 2px 2px 12px; display:flex; justify-content:space-between; align-items:center; gap: 8px; flex-wrap: wrap; }
  .part h2 small { font-weight: 500; color: var(--muted); font-size: 13px; }
  .pcol .card { margin-bottom: 10px; }
  .tag { font-size: 12px; font-weight: 800; color: var(--navy); background: var(--gold-soft); border: 1px solid #f3dc8f; border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
  .qtext { font-size: 16px; margin: 8px 0 2px; font-weight: 600; }
  .cue { font-size: 13px; color: #4a4e68; white-space: pre-line; background: var(--gold-soft); border-left: 4px solid var(--gold); border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
  .meta { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .badges { display:flex; gap:6px; flex-wrap: wrap; margin: 8px 0; }
  .badge { font-size: 12px; border-radius: 999px; padding: 2px 10px; background:#e6f5ee; color: var(--ok); font-weight: 600; }
  .badge.none { background:#fff4e5; color: var(--warn); }
  .media { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 10px; }
  .meter { height: 8px; background:#eceef6; border-radius: 4px; overflow:hidden; width: 120px; }
  .meter > div { height:100%; width:0; background: var(--rec); }
  audio, video { width: 100%; margin-top: 8px; border-radius: 8px; }
  video { max-height: 280px; background:#000; }
  .setbar { display:grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items:center; }

  /* 채점 */
  .alist { display:grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .arow { display:grid; grid-template-columns: 1fr auto; gap: 4px 12px; cursor:pointer; margin:0; border-left: 5px solid var(--navy); }
  .arow:hover { border-color: var(--navy-2); border-left-color: var(--gold); }
  .pill { font-size: 12px; font-weight: 800; border-radius: 999px; padding: 3px 11px; white-space: nowrap; }
  .st-미채점 { background:#eef0f5; color: var(--muted); } .st-ai { background: var(--navy-soft); color: var(--navy); }
  .st-검토 { background:#fff4e5; color: var(--warn); } .st-공개 { background:#e6f5ee; color: var(--ok); }
  .gd { display:grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 420px); gap: 18px; align-items: start; }
  .gd-side { position: sticky; top: 86px; max-height: calc(100vh - 100px); overflow:auto; padding-bottom: 4px; }
  .gd-main .alist2 { display:grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 14px; }
  .gd-main .alist2 .card { margin: 0; }
  .bands { display:grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .bands label { font-size: 12px; color: var(--muted); display:block; margin-bottom: 2px; text-align:center; font-weight: 700; }
  .bands input { text-align:center; font-weight: 800; padding: 8px 4px; font-size: 16px; color: var(--navy); }
  .bands div:last-child input { background: var(--gold-soft); border-color: #f3dc8f; }
  .teacher-only { border: 1.5px dashed #b9b7ec; background: #fafaff; }
  .tbox { background:#f8f9fc; border:1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; white-space: pre-wrap; }
  details summary { cursor:pointer; font-size: 13px; color: var(--navy); margin-top: 8px; font-weight: 700; }
  .actions { display:flex; gap: 8px; flex-wrap: wrap; } .actions button { flex: 1; justify-content:center; padding: 11px 14px; }
  .sticky { display:none; }
  @media (max-width: 1200px) { .parts { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 980px) { .gd { grid-template-columns: 1fr; } .gd-side { position: static; max-height: none; } }
  @media (max-width: 760px) { .parts { grid-template-columns: 1fr; } .grid2 { grid-template-columns: 1fr; } .bands { grid-template-columns: repeat(3, 1fr); } }
  /* ===== Writing (교사) ===== */
  .wa-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .wa-card { cursor:pointer; margin:0; border-left: 5px solid var(--gold); }
  .wa-card:hover { border-color: var(--navy-2); border-left-color: var(--gold); }
  .wa-card .pv { font-size: 13px; color:#4a4e68; margin-top: 6px; overflow:hidden; display:-webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .ok-pill { background:#e6f5ee; color: var(--ok); } .off-pill { background:#eef0f5; color: var(--muted); }
  .img-prev img { max-width: 100%; max-height: 360px; border-radius: 8px; border:1px solid var(--line); margin-top: 8px; background:#fff; }
  .wcards { display:grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .wsub { margin:0; cursor:pointer; display:grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items:start; border-left: 5px solid var(--navy); }
  .wsub.pending { border-left-color: var(--gold); }
  .wsub:hover { border-color: var(--navy-2); }
  .wsub input[type=checkbox] { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--navy); }
  .tgl { display:inline-flex; align-items:center; gap: 6px; cursor:pointer; font-size: 12.5px; font-weight: 700; margin-top: 6px; }
  .tgl .sw { width: 34px; height: 18px; border-radius: 999px; background:#d9dbe6; position:relative; transition: background .15s; }
  .tgl .sw::after { content:''; position:absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background:#fff; transition: left .15s; }
  .tgl.on .sw { background: var(--ok); } .tgl.on .sw::after { left: 18px; } .tgl.on { color: var(--ok); } .tgl:not(.on) { color: var(--warn); }
  .delbar { position: sticky; bottom: 12px; background: var(--navy); color:#fff; border-radius: 12px; padding: 10px 14px; display:flex; justify-content:space-between; align-items:center; gap: 10px; margin-top: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  .cmp { display:grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 14px; align-items:start; }
  .outline-box { white-space: pre-wrap; font-size: 14px; color:#3b3f5c; background:#f8f9fc; border:1px solid var(--line); border-radius: 10px; padding: 12px 14px; max-height: 70vh; overflow:auto; }
  .wtool { display:flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .wtool button { padding: 7px 11px; }
  #wEditable { min-height: 320px; border:1.5px solid var(--line); border-radius: 10px; padding: 14px 16px; font-size: 16px; line-height: 1.95; background:#fff; outline: none; }
  #wEditable:focus { border-color: var(--navy-2); box-shadow: 0 0 0 3px var(--navy-soft); }
  #wEditable mark { background:#D3F9D8; border-bottom: 1.5px dotted #2F9E44; cursor: help; color: inherit; border-radius: 2px; }
  #wEditable mark mark { background:#CFE8FB; border-bottom-color:#2E6DA4; } #wEditable mark mark mark { background:#EAD9F7; border-bottom-color:#8E44AD; }
  #wEditable .ai-flag { text-decoration: underline wavy #d92d20; text-underline-offset: 3px; cursor: pointer; }
  .ai-panel { margin-top: 14px; }
  .ai-sub { font-weight: 800; color: var(--navy); margin: 14px 0 8px; font-size: 14px; }
  .ai-sug { border:1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background:#fcfcff; }
  .ai-sug .o { color: var(--bad); text-decoration: line-through; font-size: 14px; } .ai-sug .o.ctx { text-decoration: none; color: var(--muted); }
  .ai-sug label { font-size: 12px; color: var(--muted); margin: 6px 0 2px; display:block; font-weight: 700; }
  .ai-sug textarea { font-size: 14px; padding: 7px 9px; min-height: 40px; }
  .ai-sug .r { font-size: 13px; color:#4a4e68; margin-top: 4px; }
  .crow { display:grid; grid-template-columns: 18px 1fr auto; gap: 6px; align-items:start; margin-bottom: 6px; }
  .crow .h { cursor: grab; color: var(--muted); padding-top: 9px; user-select: none; }
  .crow textarea { font-size: 14px; padding: 8px 10px; min-height: 40px; }
  .crow .acts { display:flex; flex-direction:column; gap: 4px; } .crow .acts button { padding: 4px 8px; font-size: 13px; background:#fff; color: var(--ink); border:1px solid var(--line); }
  .crow.over textarea { border-color: var(--gold); }
  .chips { display:flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { display:inline-flex; align-items:center; gap: 4px; font-size: 12.5px; background: var(--navy-soft); color: var(--navy); border-radius: 999px; padding: 4px 10px; cursor:pointer; max-width: 100%; }
  .chip.fav { background: var(--gold-soft); color: var(--gold-ink); }
  .chip .x { border:0; background:none; color: inherit; padding: 0 2px; font-size: 12px; cursor:pointer; }
  @media (max-width: 1100px) { .cmp { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="topnav">
  <img src="cnsa-logo.png" alt="CNSA">
  <div class="brand"><b>IELTS 교사용</b><span>CHUNGNAM SAMSUNG ACADEMY</span></div>
  <span class="hint hidden" id="whoami" style="color:#d9d8f5; margin-left:auto"></span>
  <button class="hidden" id="btnLogout" style="background: rgba(255,255,255,.12); padding: 7px 12px; font-size: 13px">로그아웃</button>
  <div class="tabs hidden" id="tabsBar"><button class="tab on" data-tab="author">Speaking 출제</button><button class="tab" data-tab="grade">Speaking 채점</button><button class="tab" data-tab="wassign">Writing 과제</button><button class="tab" data-tab="wgrade">Writing 첨삭</button></div>
</header>
<main>
  <section id="vLogin" class="login card">
    <img src="cnsa-logo.png" alt="CNSA">
    <h1>교사용 페이지</h1>
    <p class="sub">Speaking 출제·채점과 Writing 과제·첨삭을 한 곳에서 합니다.</p>
    <p class="sub" style="margin:0">교사로 등록된 학교 Google 계정으로 로그인하세요.</p>
    <div id="gbtn" style="display:flex; justify-content:center; margin: 18px 0 6px; min-height: 44px"></div>
    <div id="loginMsg" class="hint" style="color: var(--bad); white-space: pre-line"></div>
  </section>

  <section id="vMain" class="hidden">
   <div id="tabAuthor">
    <div class="card setbar">
      <select id="setSel"></select>
      <div class="row"><button class="gold" id="btnNewSet">+ 새 차수</button><button class="plain" id="btnReload">새로고침</button></div>
    </div>
    <div id="setBox"></div>
    <div id="partsBox" class="parts"></div>
   </div>
   <div id="tabGrade" class="hidden">
    <div id="gList">
      <div class="card row between">
        <div class="row" style="flex:1; min-width:240px"><select id="gSet" style="flex:1"></select><select id="gStatus" style="width:auto">
          <option value="">전체 상태</option><option>미채점</option><option>AI 초안</option><option>검토 중</option><option>공개</option></select></div>
        <button class="plain" id="gReload">새로고침</button>
      </div>
      <div id="gRows" class="alist"></div>
    </div>
    <div id="gDetail" class="hidden"></div>
   </div>
   <div id="tabWAssign" class="hidden">
    <div class="card row between">
      <div><h2>Writing 과제</h2><p class="hint" style="margin:4px 0 0">학생 화면에는 ‘공개’한 과제만 보여요. 학생은 과제 없이 자유 연습도 할 수 있어요.</p></div>
      <div class="row"><button class="gold" id="waNew">+ 새 과제</button><button class="plain" id="waReload">새로고침</button></div>
    </div>
    <div id="waForm" class="hidden"></div>
    <div id="waList" class="wa-grid"></div>
   </div>
   <div id="tabWGrade" class="hidden">
    <div id="wgList">
      <div class="card row between">
        <div class="row" style="flex:1; min-width:260px">
          <select id="wgAssign" style="flex:1"></select>
          <select id="wgStatus" style="width:auto"><option value="">전체</option><option value="pending">미완료</option><option value="done">완료</option></select>
          <input type="text" id="wgQ" placeholder="이름·이메일 검색" style="width:180px">
        </div>
        <div class="row"><label class="switch"><input type="checkbox" id="wgAll"> 모두 선택</label><button class="plain" id="wgReload">새로고침</button></div>
      </div>
      <div class="hint" id="wgCount" style="margin: 0 0 10px"></div>
      <div id="wgRows" class="wcards"></div>
      <div class="delbar hidden" id="wgDelBar"><span id="wgDelCount"></span><button class="danger" id="wgDel">선택 삭제</button></div>
    </div>
    <div id="wgDetail" class="hidden"></div>
   </div>
  </section>
</main>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwX9kHZlbXfXKmWgrXJfnwFZH9uWew0T4xXwbsq2OQmP5aos8lgDDIthdLEAw_BJDJFNA/exec';
const RATE = 24000;
const VIDEO_MAX_MB = 25, AUDIO_MAX_MB = 15;
const DEF = { p1: 30, p2prep: 60, p2long: 120, p2follow: 30, p3: 120 };
const PART_DESC = { 1: '일상 질문', 2: '큐카드(메인) + 후속 질문', 3: '심화 토론' };

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let KEY = '', SETS = [], CUR = '';

/* ---------------- API ---------------- */
async function apiGet(params) {
  const r = await fetch(`${API_URL}?${new URLSearchParams(params)}`, { cache: 'no-store' });
  const d = await r.json();
  if (!d.ok) { if (/로그인이 만료|교사 권한/.test(d.error || '') && params.action !== 'login') setTimeout(onExpired, 0); throw Object.assign(new Error(d.error), { server: true }); }
  return d;
}
async function apiPost(payload) {
  payload.session = KEY; payload.reqId = rid(); const body = JSON.stringify(payload);
  try { const d = await fetch(API_URL, { method: 'POST', body }).then(r => r.json());
        if (!d.ok) throw Object.assign(new Error(d.error), { server: true }); return d; }
  catch (e) { if (e.server) throw e; }
  await fetch(API_URL, { method: 'POST', mode: 'no-cors', body });
  for (let i = 0; i < 60; i++) {
    await sleep(1500);
    try { const d = await fetch(`${API_URL}?action=status&id=${payload.reqId}`, { cache: 'no-store' }).then(r => r.json());
          if (d.ok) return d; if (d.error) throw Object.assign(new Error(d.error), { server: true }); }
    catch (e) { if (e.server) throw e; }
  }
  throw new Error('서버 응답을 확인하지 못했습니다.');
}
function toast(text, bad) {
  const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = text;
  document.body.appendChild(t); setTimeout(() => t.remove(), bad ? 5000 : 2200);
}
async function busy(btn, label, fn) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = label;
  try { return await fn(); } catch (e) { toast(e.message || String(e), true); }
  finally { btn.disabled = false; btn.textContent = old; }
}

/* ---------------- 로그인 (교사 Google 계정) ---------------- */
const TKEY = 'ielts_teacher_session';
async function enter(user) {
  await reload();
  $('vLogin').classList.add('hidden'); $('vMain').classList.remove('hidden');
  ['tabsBar', 'whoami', 'btnLogout'].forEach(id => $(id).classList.remove('hidden'));
  $('whoami').textContent = user.email;
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
}
function loadGis() {
  return new Promise((res, rej) => {
    if (window.google && google.accounts && google.accounts.id) return res();
    const sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true;
    sc.onload = res; sc.onerror = () => rej(new Error('Google 로그인 스크립트를 불러오지 못했습니다.'));
    document.head.appendChild(sc);
  });
}
async function initLogin(note) {
  $('vLogin').classList.remove('hidden'); $('vMain').classList.add('hidden');
  ['tabsBar', 'whoami', 'btnLogout'].forEach(id => $(id).classList.add('hidden'));
  $('loginMsg').textContent = note || '';
  try {
    const cfg = await apiGet({ action: 'config' });
    if (!cfg.clientId) { $('loginMsg').textContent = 'Apps Script 스크립트 속성에 GOOGLE_CLIENT_ID를 먼저 추가하세요.'; return; }

function confirmTwice(btn, label, fn) {
  return () => {
    if (btn.dataset.armed === '1') { btn.dataset.armed = ''; return fn(); }
    const old = btn.textContent; btn.dataset.armed = '1'; btn.textContent = label;
    setTimeout(() => { if (btn.dataset.armed === '1') { btn.dataset.armed = ''; btn.textContent = old; } }, 3500);
  };
}

/* ---------------- 녹음 엔진 ---------------- */
const REC = { ctx: null, stream: null, proc: null, active: false, chunks: [], owner: null, t0: 0, timer: null };
async function startRecording(owner, bar, timeEl) {
  const AC = window.AudioContext || window.webkitAudioContext;
  REC.ctx = new AC(); if (REC.ctx.state === 'suspended') await REC.ctx.resume();
  REC.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } });
  const src = REC.ctx.createMediaStreamSource(REC.stream);
  REC.proc = REC.ctx.createScriptProcessor(4096, 1, 1); REC.chunks = [];
  REC.proc.onaudioprocess = ev => {
    const d = ev.inputBuffer.getChannelData(0); REC.chunks.push(new Float32Array(d));
    let m = 0; for (let i = 0; i < d.length; i++) { const v = Math.abs(d[i]); if (v > m) m = v; }
    bar.style.width = Math.min(100, m * 160) + '%';
  };
  const mute = REC.ctx.createGain(); mute.gain.value = 0;
  src.connect(REC.proc); REC.proc.connect(mute); mute.connect(REC.ctx.destination);
  REC.active = true; REC.owner = owner; REC.t0 = Date.now();
  REC.timer = setInterval(() => timeEl.textContent = Math.round((Date.now() - REC.t0) / 1000) + '초', 250);
}
function stopRecording() {
  const rate = REC.ctx.sampleRate; clearInterval(REC.timer);
  try { REC.proc.disconnect(); } catch (_) {}
  REC.stream.getTracks().forEach(t => t.stop()); REC.ctx.close(); REC.active = false; REC.owner = null;
  let len = 0; REC.chunks.forEach(c => len += c.length);
  const all = new Float32Array(len); let o = 0; REC.chunks.forEach(c => { all.set(c, o); o += c.length; });
  return encodeWav(trimSilence(downsample(all, rate, RATE)), RATE);
}
function trimSilence(s) {
  const th = 0.02, pad = Math.floor(RATE * 0.15); let a = 0, b = s.length - 1;
  while (a < s.length && Math.abs(s[a]) < th) a++;
  while (b > a && Math.abs(s[b]) < th) b--;
  return b <= a ? s : s.slice(Math.max(0, a - pad), Math.min(s.length, b + pad));
}
function downsample(buf, from, to) {
  if (to >= from) return buf;
  const r = from / to, n = Math.floor(buf.length / r), out = new Float32Array(n); let pos = 0;
  for (let i = 0; i < n; i++) { const end = Math.floor((i + 1) * r); let s = 0, c = 0; for (; pos < end && pos < buf.length; pos++) { s += buf[pos]; c++; } out[i] = c ? s / c : 0; }
  return out;
}
function encodeWav(samples, rate) {
  const buf = new ArrayBuffer(44 + samples.length * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
  v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, samples.length * 2, true);
  for (let i = 0, o = 44; i < samples.length; i++, o += 2) { const s = Math.max(-1, Math.min(1, samples[i])); v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
  return new Blob([buf], { type: 'audio/wav' });
}
function ext(name, d) { const m = String(name).match(/\.([a-z0-9]+)$/i); return m ? m[1].toLowerCase() : d; }
async function toBase64(blob) {
  const bytes = new Uint8Array(await blob.arrayBuffer()); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64ToBlob(b64, mime) {
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], { type: mime });
}

function switchTab(t) {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $('tabAuthor').classList.toggle('hidden', t !== 'author'); $('tabGrade').classList.toggle('hidden', t !== 'grade');
  $('tabWAssign').classList.toggle('hidden', t !== 'wassign'); $('tabWGrade').classList.toggle('hidden', t !== 'wgrade');
  WT.pasteTarget = null;
  if (t === 'grade') { fillSetFilter(); showList(); loadAttempts(); }
  if (t === 'wassign') { vis('waForm', false); waLoad().catch(e => toast(e.message, true)); }
  if (t === 'wgrade') { wgShowList(); wgLoad().catch(e => toast(e.message, true)); }
}
function fillSetFilter() {
  const sel = $('gSet'), cur = sel.value; sel.innerHTML = '<option value="">전체 차수</option>';
  SETS.forEach(s => sel.add(new Option(`${s.id} · ${s.title}`, s.id))); sel.value = cur;
}
$('gSet').onchange = renderAttempts; $('gStatus').onchange = renderAttempts;
$('gReload').onclick = () => busy($('gReload'), '불러오는 중…', loadAttempts);
async function loadAttempts() { GA = (await apiGet({ action: 'tattempts', session: KEY })).attempts; renderAttempts(); }
const pillCls = g => 'pill ' + (g === '미채점' ? 'st-미채점' : g === 'AI 초안' ? 'st-ai' : g === '검토 중' ? 'st-검토' : 'st-공개');
function renderAttempts() {
  const set = $('gSet').value, st = $('gStatus').value;
  const list = GA.filter(a => (!set || a.setId === set) && (!st || a.grade === st));
  $('gRows').innerHTML = list.length ? '' : '<div class="card sub">응시 기록이 없습니다.</div>';
  list.forEach(a => {
    const el = document.createElement('div'); el.className = 'card arow';
    el.innerHTML = `<div><b>${esc(a.name)}</b> <span class="hint">${esc(a.sid || '')} ${esc(a.email || '')}</span><div class="hint">${esc(a.setTitle)} · ${esc(a.start)} · 답변 ${a.answers}개${a.status && a.status !== '완료' ? ' · ' + esc(a.status) : ''}</div></div>
      <div style="text-align:right"><span class="${pillCls(a.grade)}">${esc(a.grade)}</span>${a.band ? `<div class="hint" style="margin-top:4px">Band ${esc(a.band)}</div>` : ''}</div>`;
    el.onclick = () => openAttempt(a.attemptId);
    $('gRows').appendChild(el);
  });
}
function showList() { $('gList').classList.remove('hidden'); $('gDetail').classList.add('hidden'); }
async function openAttempt(id) {
  try { const d = await apiGet({ action: 'tattempt', session: KEY, id }); renderDetail(d); }
  catch (e) { toast(e.message, true); }
}

function overallBand(arr) {
  const v = arr.map(Number).filter(n => !isNaN(n) && n > 0); if (v.length < 4) return '';
  return String(Math.floor(v.reduce((s, n) => s + n, 0) / 4 * 2 + 0.5) / 2);
}

function answerCard(x) {
  const el = document.createElement('div'); el.className = 'card'; el.dataset.part = x.part; el.dataset.order = x.order;
  el.innerHTML = `
    <div class="row between"><span class="tag">P${x.part}-${x.order}</span><span class="hint">${esc(x.duration)}초${Number(x.peak) < 0.02 ? ' · ⚠ 소리 거의 없음' : ''}</span></div>
    <div class="qtext">${esc(x.question)}</div>
    <div class="row" style="margin-top:6px"><button class="plain" data-listen>▶ 학생 녹음 듣기</button></div><div data-player></div>
    <label class="f">AI 전사</label><div class="tbox" data-tr>${x.aiTranscript ? esc(x.aiTranscript) : '<span class="hint">아직 없음</span>'}</div>
    <details data-notesw ${x.aiNotes ? '' : 'class="hidden"'}><summary>AI 메모 (교사용)</summary><div class="tbox" style="margin-top:6px" data-notes>${esc(x.aiNotes)}</div></details>
    <label class="f">학생에게 줄 피드백</label><textarea rows="7" data-fb placeholder="AI 초안을 만들면 채워집니다.">${esc(x.teacherFeedback)}</textarea>`;
  const f = n => el.querySelector(`[data-${n}]`);
  f('listen').onclick = () => busy(f('listen'), '불러오는 중…', async () => {
    const d = await apiGet({ action: 'tanswerAudio', session: KEY, fileId: x.fileId });
    f('player').innerHTML = `<audio controls autoplay src="${URL.createObjectURL(b64ToBlob(d.data, d.mime))}"></audio>`;
  });
  el._update = r => {
    f('tr').textContent = r.aiTranscript || '(인식된 발화 없음)';
    f('notes').textContent = r.aiNotes || ''; f('notesw').classList.toggle('hidden', !r.aiNotes);
    if (r.teacherFeedback != null) f('fb').value = r.teacherFeedback;
  };
  return el;
}

function collect() {
  const box = $('gDetail'); const v = k => box.querySelector(`[data-band="${k}"]`).value;
  return {
    answers: [...box.querySelectorAll('[data-answers] > .card')].map(c => ({ part: +c.dataset.part, order: +c.dataset.order, teacherFeedback: c.querySelector('[data-fb]').value })),
    overall: { fc: v('fc'), lr: v('lr'), gra: v('gra'), p: v('p'), overall: v('overall'), teacherSummary: box.querySelector('[data-summary]').value }
  };
}
async function saveGrade(publish) {
  return apiPost({ action: 'gradeSave', attemptId: GCUR.attempt.attemptId, publish, ...collect() });
}
async function runAi(overwrite, prog) {
  const a = GCUR.attempt;
  await saveGrade(a.published);                         // 지금까지 고친 내용 먼저 저장
  const cards = [...$('gDetail').querySelectorAll('[data-answers] > .card')];
  for (let i = 0; i < cards.length; i++) {
    const c = cards[i]; prog.textContent = `문항 ${i + 1}/${cards.length} 분석 중… (문항당 10~30초)`;
    c.style.borderColor = 'var(--accent)';
    const r = await apiPost({ action: 'aiAnswer', attemptId: a.attemptId, part: +c.dataset.part, order: +c.dataset.order, overwrite });
    c._update(r); c.style.borderColor = '';
  }
  prog.textContent = '종합 평가 작성 중…';
  const d = await apiPost({ action: 'aiOverall', attemptId: a.attemptId, overwrite });
  renderDetail(d); toast('AI 초안을 만들었어요. 검토 후 공개하세요.');
}
function vis(id, on) { (typeof id === 'string' ? $(id) : id).classList.toggle('hidden', !on); }

    <label class="f">문제 이미지 (선택)</label>
    <div class="row"><select data-img style="flex:1; min-width:200px"><option value="">연결 안 함</option></select>
      <label class="btn ghost">📤 새 이미지<input type="file" accept="image/*" data-file class="hidden"></label>
      <button class="danger" data-imgdel>라이브러리에서 삭제</button></div>
    <div class="hint">캡처한 이미지를 복사한 뒤 이 화면에서 <b>Ctrl+V</b>로 붙여넣어도 올라가요.</div>
    <div class="img-prev" data-prev></div>

  q('task').onchange = () => { a.type = ''; fillTypes(); }; fillTypes();

    const id = q('img').value; q('imgdel').disabled = !id; q('prev').innerHTML = id ? '<span class="hint">미리보기 불러오는 중…</span>' : '';
    if (!id) return;
    try { const d = await apiGet({ action: 'wtImage', session: KEY, id }); q('prev').innerHTML = `<img src="data:${d.mime};base64,${d.data}">`; } catch (e) { q('prev').innerHTML = `<span class="hint">${esc(e.message)}</span>`; }
  };
  q('img').onchange = showPrev;
  fillImgs(a.imageId);
  const upload = file => waUploadImage(file, id => fillImgs(id));
  q('file').onchange = e => { const file = e.target.files[0]; e.target.value = ''; if (file) upload(file); };
  WT.pasteTarget = upload;
  q('imgdel').onclick = confirmTwice(q('imgdel'), '정말 삭제? (연결도 해제)', () => busy(q('imgdel'), '삭제 중…', async () => {
    await apiPost({ action: 'wtImageDelete', id: q('img').value }); await waImages(true); fillImgs(''); toast('이미지를 삭제했어요.');
  }));
  q('cancel').onclick = () => { f.classList.add('hidden'); WT.pasteTarget = null; };
  q('save').onclick = () => busy(q('save'), '저장 중…', async () => {
    const d = await apiPost({ action: 'wtAssignSave', assignment: { id: a.id || '', title: q('title').value, task: q('task').value, type: q('type').value,
      prompt: q('prompt').value, imageId: q('img').value, open: q('open').checked, limit: q('limit').value } });

  });
  if (q('del')) q('del').onclick = confirmTwice(q('del'), '정말 삭제? (제출물은 남아요)', () => busy(q('del'), '삭제 중…', async () => {
    await apiPost({ action: 'wtAssignDelete', id: a.id }); f.classList.add('hidden'); WT.pasteTarget = null; toast('과제를 삭제했어요.'); await waLoad();
  }));
  f.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
async function waUploadImage(file, done) {
  if (file.size > 15 * 1048576) return toast('이미지는 15MB 이하만 올릴 수 있어요.', true);
  const label = prompt('이 문제 이미지의 이름을 입력하세요 (예: "Task 1 - 지도 문제")', '');
  if (label === null) return;
  toast('이미지를 올리는 중…');
  try {
    const d = await apiPost({ action: 'wtImageUpload', label: label || '제목 없음', mime: file.type || 'image/png', data: await toBase64(file) });
    await waImages(true); done(d.id); toast('이미지를 올렸어요.');
  } catch (e) { toast('업로드 실패: ' + e.message, true); }
}
document.addEventListener('paste', e => {   // 캡처 이미지 붙여넣기 → 문제 이미지 업로드
  if (!WT.pasteTarget) return;
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable)) return;
  const it = [...((e.clipboardData && e.clipboardData.items) || [])].find(i => i.type && i.type.startsWith('image/'));
  if (it) { e.preventDefault(); WT.pasteTarget(it.getAsFile()); }
});

async function wgLoad() {
  const [s, a] = await Promise.all([apiGet({ action: 'wtSubs', session: KEY }), apiGet({ action: 'wtAssignments', session: KEY })]);
  WT.subs = s.subs; WT.assignments = a.assignments; WT.taskTypes = a.taskTypes;
  const sel = $('wgAssign'), cur = sel.value;
  sel.innerHTML = '<option value="">전체 과제·자유 연습</option><option value="__free">자유 연습만</option>' + WT.assignments.map(x => `<option value="${esc(x.id)}">${esc(x.id)} · ${esc(x.title)}</option>`).join('');
  sel.value = cur; wgRender();
}
['wgAssign', 'wgStatus'].forEach(id => $(id).onchange = wgRender); $('wgQ').oninput = wgRender;
$('wgReload').onclick = () => busy($('wgReload'), '불러오는 중…', wgLoad);
function wgVisible() {
  const a = $('wgAssign').value, st = $('wgStatus').value, q = $('wgQ').value.trim().toLowerCase();
  return WT.subs.filter(s => (!a || (a === '__free' ? !s.assignmentId : s.assignmentId === a)) && (!st || (st === 'done') === s.done) &&
    (!q || (s.name + ' ' + s.email + ' ' + s.cls + ' ' + s.sid).toLowerCase().includes(q)));
}
function wgRender() {
  const list = wgVisible(); const ids = new Set(list.map(s => s.id));
  [...WT.sel].forEach(id => { if (!ids.has(id)) WT.sel.delete(id); });
  $('wgCount').textContent = `전체 ${WT.subs.length}건 · 미완료 ${WT.subs.filter(s => !s.done).length}건 · 표시 ${list.length}건`;
  const box = $('wgRows'); box.innerHTML = list.length ? '' : '<div class="card hint">해당하는 제출물이 없어요.</div>';
  list.forEach(s => {
    const el = document.createElement('div'); el.className = 'card wsub' + (s.done ? '' : ' pending');
    el.innerHTML = `<input type="checkbox" ${WT.sel.has(s.id) ? 'checked' : ''}>
      <div><b>${esc(s.name)}</b> <span class="hint">${esc(s.cls || s.sid || '')} · ${esc(s.email)}</span>
        <div class="hint">${esc(s.writingDate)} · ${esc(s.assignmentTitle || '자유 연습')} · ${esc(s.task)} · ${esc(s.type)} · ${esc(s.words)} words</div>
        <span class="tgl ${s.done ? 'on' : ''}" title="메일 없이 완료/미완료 상태만 바꿔요"><span class="sw"></span>${s.done ? '완료(학생 공개)' : (s.drafted ? '첨삭 중' : '미완료')}</span></div>
      <div style="text-align:right">${s.band ? `<span class="pill st-ai">Band ${esc(s.band)}</span>` : ''}</div>`;
    el.querySelector('input').onclick = e => { e.stopPropagation(); e.target.checked ? WT.sel.add(s.id) : WT.sel.delete(s.id); wgDelBar(); };
    el.querySelector('.tgl').onclick = async e => {
      e.stopPropagation();
      try { const r = await apiPost({ action: 'wtToggle', id: s.id }); s.done = r.done; wgRender(); } catch (err) { toast(err.message, true); }
    };
    el.onclick = () => wgOpen(s.id);

function wrapFirst(root, text, idx) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null); let n;

      const p = n.parentNode; p.insertBefore(document.createTextNode(n.nodeValue.slice(0, pos)), n); p.insertBefore(span, n);
      p.insertBefore(document.createTextNode(n.nodeValue.slice(pos + text.length)), n); p.removeChild(n); return true;
    }
  }

}
